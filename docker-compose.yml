# Development compose — works with both `docker compose` and `podman compose`
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data:Z
    environment:
      - DB_PATH=/data/tanteemma.db
      - SESSION_HASH_KEY=${SESSION_HASH_KEY}
      - SESSION_BLOCK_KEY=${SESSION_BLOCK_KEY}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_REDIRECT_URL=${OIDC_REDIRECT_URL}
      - FRONTEND_URL=http://localhost:5173
      - LOG_LEVEL=debug
    restart: unless-stopped

  # Serves the production static build (sirv). For day-to-day frontend work use
  # `cd frontend && npm run dev` instead — its Vite proxy makes /api + /ws
  # same-origin. This container expects to sit behind a same-origin reverse proxy
  # (as in docker-compose.prod.yml); on its own it can't reach the backend
  # cross-origin with cookies.
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:3000"
    depends_on:
      - backend
    restart: unless-stopped
