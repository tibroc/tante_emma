# Production compose — extends docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  backend:
    environment:
      - LOG_LEVEL=info
      - FRONTEND_URL=${FRONTEND_URL}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M

  frontend:
    # The React SPA is a static build (served by sirv) and talks to the backend
    # same-origin (/api, /ws) behind the reverse proxy — no runtime API URL env.
    # For a cross-origin deploy, pass VITE_API_URL/VITE_WS_URL as build args in
    # Dockerfile.frontend instead (baked in at build time, not runtime).
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  litestream:
    image: litestream/litestream:0.3
    volumes:
      - ./data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    command: replicate
    environment:
      - LITESTREAM_ACCESS_KEY_ID=${LITESTREAM_ACCESS_KEY_ID:-}
      - LITESTREAM_SECRET_ACCESS_KEY=${LITESTREAM_SECRET_ACCESS_KEY:-}
    restart: unless-stopped
    depends_on:
      - backend
