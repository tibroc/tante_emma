version: "2"

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - gosimple
    - misspell
    - bodyclose
    - gofmt

linters-settings:
  gofmt:
    simplify: true

issues:
  exclude-rules:
    # Test files don't need to check every error return.
    - path: "_test\\.go"
      linters: [errcheck]
